name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official Rocq image. There is no 9.1.0 tag; the opam file accepts the
      # 9.1.x series (rocq-core >= 9.1.0 < 9.2.0, rocq-stdlib >= 9.0.0 < 9.2.0),
      # which covers both the development machine and this image.
      - uses: coq-community/docker-coq-action@v1.5.2
        with:
          opam_file: 'ledger-calculus.opam'
          custom_image: 'rocq/rocq-prover:9.1'
