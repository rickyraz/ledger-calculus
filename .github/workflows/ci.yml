name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official Rocq image. There is no 9.1.0 tag yet; the dependencies in
      # ledger-calculus.opam (rocq-core = 9.1.0, rocq-stdlib = 9.0.0) force the
      # same versions as the development machine.
      - uses: coq-community/docker-coq-action@v1.5.2
        with:
          opam_file: 'ledger-calculus.opam'
          custom_image: 'rocq/rocq-prover:9.1'
